# vim:fileencoding=utf-8:ft=kitty

# ==============================================================================
#  FONTS (FiraCode Nerd Font with ligatures)
# ==============================================================================
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0
disable_ligatures cursor
adjust_line_height  115%

# ==============================================================================
#  WINDOW, PADDING & OPACITY (Hyprland integration)
# ==============================================================================
window_padding_width 12 16
window_margin_width  0
hide_window_decorations yes
confirm_os_window_close 0

# Deeper background opacity: high contrast with Hyprland blur
background_opacity 0.90
dynamic_background_opacity yes

# ==============================================================================
#  CURSOR & MOUSE
# ==============================================================================
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
underline_hyperlinks hover

# ==============================================================================
#  TERMINAL BELL
# ==============================================================================
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# ==============================================================================
#  TAB BAR (Cyber/Powerline slanted style)
# ==============================================================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
active_tab_font_style   bold
inactive_tab_font_style normal

# ==============================================================================
#  SCROLLBACK & PERFORMANCE
# ==============================================================================
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0
repaint_delay 10
input_delay 2
sync_to_monitor yes

# ==============================================================================
#  KEYBINDINGS & SHORTCUTS
# ==============================================================================
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Opacity adjustments
map ctrl+shift+u set_background_opacity +0.05
map ctrl+shift+d set_background_opacity -0.05
map ctrl+shift+r set_background_opacity default

# Reload configuration instantly
map ctrl+shift+f5 load_config_file

# ==============================================================================
#  COLOR THEME: Tokyo Night Moon / Deep Abyss Neon
#  Deep obsidian base (#101017) with vivid, punchy neon accents
# ==============================================================================
foreground              #c8d3f5
background              #101017
selection_foreground    #101017
selection_background    #ff757f

# Cursor
cursor                  #4fd6be
cursor_text_color       #101017

# URL underline
url_color               #00f5d4

# Borders
active_border_color     #bb9af7
inactive_border_color   #1e2030
bell_border_color       #ff9e64

# Tab bar
active_tab_foreground   #101017
active_tab_background   #bb9af7
inactive_tab_foreground #828bb8
inactive_tab_background #161622
tab_bar_background      #0c0c12

