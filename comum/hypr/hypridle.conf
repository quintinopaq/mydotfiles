# ==============================================================================
#  HYPRIDLE CONFIGURATION (Integrado com o Caelestia Shell Lockscreen)
# ==============================================================================
general {
    lock_cmd = caelestia shell lock lock
    unlock_cmd = caelestia shell lock unlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 1. Escurecer tela (após 2.5 min) via DDCUTIL
listener {
    timeout = 150
    on-timeout = ddcutil setvcp 10 10 --bus 7 2>/dev/null || true
    on-resume = ddcutil setvcp 10 80 --bus 7 2>/dev/null || true
}

# 2. Bloquear tela com o Caelestia Shell (após 5 min)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Desligar sinal de vídeo DPMS (após 5.5 min)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 4. Suspender o sistema (após 10 min)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
